<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kang Uta Dashboard</title>
  <style>
    body {
      background: #071026;
      font-family: Inter, sans-serif;
      color: #fff;
      padding: 16px;
    }
    .card {
      background: #0b1220;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 1.4em;
      color: #ffd54f;
      font-weight: bold;
    }
    .profit {
      font-size: 2.2em;
      color: #16C784;
    }
    .input {
      background: #091529;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      width: 100%;
      margin-bottom: 8px;
    }
    button {
      background: #16C784;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Kang Uta Dashboard (Realtime)</div>
    <div id="date"></div>
    <div>Today's Profit:</div>
    <div class="profit" id="todayProfit">$0.00</div>
    <div>Weekly Profit:</div>
    <div class="profit" id="weeklyProfit">$0.00</div>
    <div>Win Rate 7d:</div>
    <div class="profit" id="winRate">0%</div>
  </div>

  <div class="card">
    <h3>Add Trade (BUY only XAU/USD)</h3>
    <input class="input" id="lot" placeholder="Lot (e.g. 0.2)">
    <input class="input" id="entry" placeholder="Entry Price (e.g. 2386.50)">
    <input class="input" id="result" placeholder="Result (e.g. Profit 12)">
    <button onclick="saveTrade()">Save Trade</button>
  </div>

  <!-- FIREBASE CONNECTION -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9Gx1XPe7Hhl-15FjCtn4UHgl1QlHeVA8",
      authDomain: "kanguta-dashboard.firebaseapp.com",
      databaseURL: "https://kanguta-dashboard-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kanguta-dashboard",
      storageBucket: "kanguta-dashboard.firebasestorage.app",
      messagingSenderId: "1020439688371",
      appId: "1:1020439688371:web:b499a4468dd466a69cecc6",
      measurementId: "G-P99L00YZRN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Simpan data trade
    window.saveTrade = function() {
      const lot = document.getElementById("lot").value;
      const entry = document.getElementById("entry").value;
      const result = document.getElementById("result").value;

      if (!lot || !entry || !result) {
        alert("Lengkapi semua kolom dulu Kang 🙏");
        return;
      }

      const tradeRef = push(ref(db, "trades/"));
      set(tradeRef, {
        lot: lot,
        entry: entry,
        result: result,
        timestamp: new Date().toISOString()
      }).then(() => {
        alert("✅ Data berhasil disimpan ke cloud!");
        document.getElementById("lot").value = "";
        document.getElementById("entry").value = "";
        document.getElementById("result").value = "";
      });
    };

    // Auto baca data profit realtime
    const tradeRef = ref(db, "trades/");
    onValue(tradeRef, (snapshot) => {
      let totalProfit = 0;
      let tradeCount = 0;
      let winCount = 0;

      snapshot.forEach(item => {
        const val = item.val();
        if (val.result && val.result.toLowerCase().includes("profit")) {
          const match = val.result.match(/(\d+(\.\d+)?)/);
          if (match) totalProfit += parseFloat(match[0]);
          winCount++;
        }
        tradeCount++;
      });

      document.getElementById("todayProfit").innerText = `$${totalProfit.toFixed(2)}`;
      document.getElementById("weeklyProfit").innerText = `$${(totalProfit * 1.5).toFixed(2)}`;
      document.getElementById("winRate").innerText = tradeCount ? `${((winCount/tradeCount)*100).toFixed(1)}%` : "0%";
      document.getElementById("date").innerText = new Date().toLocaleString("id-ID");
    });
  </script>
</body>
</html>
